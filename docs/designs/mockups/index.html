<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Elefant Blaster Mockups</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;700;800;900&display=swap&subset=vietnamese" rel="stylesheet">
<style>
:root{
  /* Viewer: a dark studio desk so the bright game art pops. Layout: screen index on the left, device stage + notes on the right. */
  --desk:#0d1330; --desk-2:#151d44; --line:#2a3970; --text:#e9eeff; --muted:#9ba7d3; --accent:#ffc83a;
  --display:"Lilita One","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  /* Game UI tokens, taken from the art: navy outline, cloud panels, wood signs, sun-yellow buttons */
  --navy:#1b2f6e; --sky:#2f8cf0; --sun:#ffcf2e; --wood-d:#6e3b15; --leaf:#3fa33a; --berry:#e8473f; --gtext:#1b2a55;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--desk);color:var(--text);font-family:var(--body);font-weight:700}
a{color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* ---------- viewer chrome ---------- */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;padding:12px 20px;border-bottom:1px solid var(--line);background:var(--desk-2);position:sticky;top:0;z-index:20}
.top h1{margin:0;font-family:var(--display);font-weight:400;font-size:22px;letter-spacing:.5px;color:var(--accent)}
.top h1 small{font-family:var(--body);font-weight:700;font-size:13px;color:var(--muted);margin-left:8px;letter-spacing:0}
.seg{display:flex;flex-wrap:wrap;gap:4px;background:#0b1029;border:1px solid var(--line);border-radius:12px;padding:4px;margin-left:auto}
.seg button{font:800 14px var(--body);color:var(--muted);background:none;border:0;border-radius:8px;padding:8px 14px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:#2a1d00}
.wrap{display:grid;grid-template-columns:230px 1fr;min-height:calc(100% - 62px)}
.idx{border-right:1px solid var(--line);padding:14px 12px;display:flex;flex-direction:column;gap:14px;background:var(--desk)}
.idx h2{margin:0 0 4px;font-size:11px;letter-spacing:1.4px;text-transform:uppercase;color:var(--muted)}
.idx a{display:block;text-decoration:none;padding:7px 10px;border-radius:8px;font-size:14px;color:var(--text)}
.idx a:hover{background:var(--desk-2)}
.idx a[aria-current="page"]{background:#24306a;color:var(--accent)}
main{padding:18px 22px 40px;min-width:0;display:flex;flex-direction:column;gap:18px}
.stage-h{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.stage-h h2{margin:0;font-family:var(--display);font-weight:400;font-size:26px;letter-spacing:.4px}
.stage-h span{color:var(--muted);font-size:14px}
.stage{display:flex;flex-direction:column;gap:22px}
.row2{display:grid;grid-template-columns:minmax(0,.62fr) minmax(0,1.4fr);gap:22px;align-items:start}
.row2.rev{grid-template-columns:minmax(0,1.9fr) minmax(0,.6fr)}
.holder{position:relative;width:100%}
.cap{font-size:12px;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.notes{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.note{background:var(--desk-2);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.note h3{margin:0 0 8px;font-size:15px;color:var(--accent)}
.note.doc h3{color:#ff9d8a}
.note ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:14px;line-height:1.45;color:#d7def7}
.note b{color:#fff}
@media (max-width:860px){
  .wrap{grid-template-columns:1fr}
  .idx{border-right:0;border-bottom:1px solid var(--line);flex-direction:row;overflow-x:auto;padding:10px 16px}
  .idx section{flex:none;display:flex;gap:4px;align-items:center}
  .idx h2{display:none}
  .idx a{white-space:nowrap}
  .row2,.row2.rev{grid-template-columns:1fr}
  main{padding:14px 16px 32px}
  .seg{margin-left:0}
}

/* ---------- devices ---------- */
.device{position:absolute;top:0;left:0;transform-origin:0 0}
.device.desktop{width:1280px;border-radius:12px;overflow:hidden;background:#0b0f24;box-shadow:0 0 0 1px #34407a,0 20px 50px rgba(0,0,0,.5)}
.wbar{height:34px;display:flex;align-items:center;gap:8px;padding:0 14px;background:#1d2340;color:#aab3d6;font:700 13px var(--body)}
.wbar i{width:12px;height:12px;border-radius:50%;background:#ff5f57}.wbar i:nth-child(2){background:#febc2e}.wbar i:nth-child(3){background:#28c840}
.wbar span{margin-left:12px}
.device.portrait{width:414px;height:868px;padding:12px;border-radius:58px;background:#05070f;box-shadow:0 0 0 2px #3a4466,0 20px 50px rgba(0,0,0,.5)}
.device.landscape{width:868px;height:414px;padding:12px;border-radius:58px;background:#05070f;box-shadow:0 0 0 2px #3a4466,0 20px 50px rgba(0,0,0,.5)}
.scr{position:relative;overflow:hidden;font-family:var(--body);color:var(--gtext);background:#2f8cf0;font-weight:700}
.desktop .scr{width:1280px;height:800px}
.portrait .scr{width:390px;height:844px;border-radius:46px}
.landscape .scr{width:844px;height:390px;border-radius:46px}
.sbar{position:absolute;top:0;left:0;right:0;height:46px;display:flex;align-items:center;justify-content:space-between;padding:0 30px;color:#fff;font-size:15px;z-index:9}
.isl{position:absolute;left:50%;top:11px;width:118px;height:32px;background:#000;border-radius:20px;transform:translateX(-50%)}
.sig{display:flex;align-items:flex-end;gap:2px}.sig i{width:3px;background:#fff;border-radius:1px}.sig i:nth-child(1){height:5px}.sig i:nth-child(2){height:7px}.sig i:nth-child(3){height:9px}.sig i:nth-child(4){height:11px;margin-right:6px}
.bat{width:24px;height:12px;border:2px solid #fff;border-radius:4px;position:relative}.bat::after{content:"";position:absolute;inset:1px 5px 1px 1px;background:#fff;border-radius:1px}
.home{position:absolute;bottom:7px;left:50%;width:134px;height:5px;border-radius:3px;background:rgba(255,255,255,.85);transform:translateX(-50%);z-index:9}
.lisl{position:absolute;left:9px;top:50%;width:32px;height:118px;background:#000;border-radius:20px;transform:translateY(-50%);z-index:9}

/* ---------- game UI kit ---------- */
.bg{position:absolute;inset:0;background:url(../../../assets/graphics/home/background_h.png) center/cover no-repeat}
/* phones in portrait use the portrait art, anchored to the bottom so the elephants stay in view */
.portrait .bg{background-image:url(../../../assets/graphics/home/background_v.png);background-position:center bottom}
.veil{position:absolute;inset:0;background:linear-gradient(180deg,rgba(18,40,110,.62),rgba(8,18,58,.86))}
.layer{position:absolute;inset:0;display:flex;flex-direction:column}
.portrait .layer{padding:46px 0 22px}
.landscape .layer{padding:0 44px 14px 50px}
.body{flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column;gap:16px;padding:18px 26px}
.portrait .body{padding:12px 14px;gap:12px}
.landscape .body{padding:10px 8px;gap:10px}
.tb{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;padding:8px 20px;background:linear-gradient(#21409a,#162c70);border-bottom:4px solid #0d1b4a;position:relative;z-index:2}
.tb .l,.tb .r{display:flex;align-items:center;gap:12px;min-width:0}
.tb .r{justify-content:flex-end}
.tb.portrait{grid-template-columns:48px 1fr 48px;padding:6px 12px;background:none;border:0}
.tb.portrait .sign{justify-self:center}
.tb.landscape{padding:6px 10px;background:none;border:0}
.tb-logo{height:58px;margin:-8px 0;filter:drop-shadow(0 2px 0 rgba(0,0,0,.25))}
.sign{font-family:var(--display);color:var(--sun);font-size:26px;letter-spacing:1px;line-height:1.1;padding:6px 26px;background:linear-gradient(#c87d3a,#97521f);border:3px solid var(--wood-d);border-radius:12px;box-shadow:inset 0 2px 0 rgba(255,255,255,.28),0 4px 0 var(--wood-d);text-shadow:0 2px 0 #6a2f08;white-space:nowrap;text-align:center}
.tb.portrait .sign,.tb.landscape .sign{padding:4px 16px;border-radius:10px}
.uchip{display:flex;align-items:center;gap:8px;color:#fff;line-height:1.1}
.uchip b{display:block;font-size:15px}.uchip small{font-size:12px;color:#bcd0ff}
.btn{font-family:var(--display);font-weight:400;font-size:20px;color:var(--gtext);background:linear-gradient(#ffe36b,#ffbd1c);border:3px solid var(--navy);border-radius:14px;padding:9px 20px;box-shadow:0 5px 0 var(--navy);letter-spacing:.5px;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;cursor:pointer;text-decoration:none;line-height:1.1}
.btn.blue{background:linear-gradient(#72c8ff,#2f8cf0);color:#fff;text-shadow:0 2px 0 #1b4fa8}
.btn.red{background:linear-gradient(#ff8f80,#e0443b);color:#fff;text-shadow:0 2px 0 #8e1e18}
.btn.green{background:linear-gradient(#93e870,#3aa135);color:#fff;text-shadow:0 2px 0 #1d6219}
.btn.ghost{background:linear-gradient(#ffffff,#dbe9ff)}
.btn.sm{font-size:15px;padding:5px 12px;border-radius:10px;box-shadow:0 3px 0 var(--navy);border-width:2px}
.btn.xs{font-size:13px;padding:3px 9px;border-radius:8px;box-shadow:0 2px 0 var(--navy);border-width:2px}
.btn.lg{font-size:26px;padding:12px 26px}
.btn.xl{font-size:30px;padding:14px 28px;border-radius:18px;box-shadow:0 6px 0 var(--navy)}
.btn.icon{width:42px;height:42px;padding:0;border-radius:12px}
.btn.block{width:100%}
.btn.dis{filter:grayscale(.9);opacity:.65}
.cloud{background:linear-gradient(#f8fcff,#d9eeff);border:4px solid var(--navy);border-radius:22px;box-shadow:0 0 0 3px rgba(255,255,255,.85),0 8px 0 rgba(5,15,50,.35);padding:16px;display:flex;flex-direction:column;gap:12px;min-height:0;position:relative}
.portrait .cloud,.landscape .cloud{border-width:3px;border-radius:18px;padding:12px;gap:10px;box-shadow:0 0 0 2px rgba(255,255,255,.85),0 5px 0 rgba(5,15,50,.35)}
.h{font-family:var(--display);font-weight:400;color:var(--navy);font-size:21px;letter-spacing:.4px;margin:0;display:flex;align-items:center;gap:8px}
.portrait .h,.landscape .h{font-size:17px}
.h .sp{margin-left:auto}
.lbl{font-size:12px;font-weight:900;color:#4a5a8c;letter-spacing:.6px;text-transform:uppercase}
.in{display:flex;align-items:center;gap:8px;height:40px;padding:0 12px;background:#fff;border:3px solid var(--navy);border-radius:10px;color:#8a96b8;font-weight:800;font-size:15px;min-width:0}
.in span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.in.v{color:var(--gtext)}
.in.sel b{margin-left:auto;color:var(--navy)}
.portrait .in,.landscape .in{height:36px;border-width:2px;font-size:14px}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld.inl{flex-direction:row;align-items:center;gap:10px}
.fld.inl>.lbl{width:120px;flex:none}
.chk{display:inline-flex;align-items:center;gap:8px;font-weight:800;font-size:15px;white-space:nowrap}
.chk i{width:22px;height:22px;border:3px solid var(--navy);border-radius:6px;background:#fff;display:grid;place-items:center;flex:none}
.chk.on i{background:var(--leaf)}
.chk.on i::after{content:"";width:5px;height:10px;border:solid #fff;border-width:0 3px 3px 0;transform:translateY(-1px) rotate(45deg)}
.tog{width:44px;height:26px;border-radius:13px;background:#c6cfe4;border:2px solid var(--navy);position:relative;flex:none}
.tog::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;border:2px solid var(--navy)}
.tog.on{background:var(--leaf)}.tog.on::after{left:20px}
.row{display:flex;align-items:center;gap:10px;min-width:0}
.row.sb{justify-content:space-between}
.row.wrapr{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.lnk{color:#1f5fd1;font-weight:900;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.lnk.c{align-self:center}
.muted{color:#5b6a99;font-weight:700}
.tbl{width:100%;border-collapse:separate;border-spacing:0;border:3px solid var(--navy);border-radius:14px;overflow:hidden;background:#fff;font-weight:800;font-variant-numeric:tabular-nums;font-size:15px}
.tbl th{background:var(--navy);color:#fff;font-family:var(--display);font-weight:400;text-align:left;padding:8px 10px;font-size:15px;letter-spacing:.4px;white-space:nowrap}
.tbl td{padding:7px 10px;border-top:2px solid #e3ecfa;white-space:nowrap}
.tbl tr:nth-child(even) td{background:#f3f8ff}
.tbl tr.me td{background:#fff1b8}
.tbl tr.sel td{background:#dff0ff;box-shadow:inset 0 0 0 0 transparent}
.tbl td.n,.tbl th.n{text-align:right}
.portrait .tbl,.landscape .tbl{font-size:13px;border-width:2px;border-radius:12px}
.portrait .tbl th,.landscape .tbl th{font-size:13px;padding:6px 8px}
.portrait .tbl td,.landscape .tbl td{padding:5px 8px}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:900;border:2px solid currentColor;white-space:nowrap;line-height:1.3}
.pill.wait,.pill.ready,.pill.live{color:#24801f;background:#e2f7dc}
.pill.ingame{color:#b85f00;background:#fff0d6}
.pill.lock,.pill.nready,.pill.off{color:#55607d;background:#e7ebf4}
.pill.official{color:#b07800;background:#fff3c4}
.pill.public{color:#1f63c9;background:#e0edff}
.pill.private{color:#7a3fbf;background:#f0e4ff}
.pill.training{color:#9b4d00;background:#ffe2b8}
.pill.host{color:#9a5a00;background:#ffe9a8}
.dot{width:9px;height:9px;border-radius:50%;background:#3fd35a;display:inline-block;box-shadow:0 0 0 3px rgba(63,211,90,.25)}
.bar{height:10px;border-radius:6px;background:#d3def5;border:2px solid var(--navy);overflow:hidden;min-width:40px}
.bar i{display:block;height:100%;background:linear-gradient(#8fe86c,#3aa135)}
.bar.sun i{background:linear-gradient(#ffe36b,#ffb000)}
.bar.sky i{background:linear-gradient(#80d0ff,#2f8cf0)}
.av{width:var(--s);height:var(--s);flex:none;border-radius:50%;border:3px solid var(--navy);background:#bfe3ff url(../../../assets/graphics/animations/player1.png) 33.333% var(--dy,0%)/400% 400% no-repeat;display:inline-block}
.av.p2{background-color:#ffdcbf;background-image:url(../../../assets/graphics/animations/player2.png)}
.av.bot,.av.guest{background:#dfe4f0;display:inline-grid;place-items:center}
.av.bot::after{content:"BOT";font:900 calc(var(--s)*.27) var(--body);color:var(--navy)}
.av.guest::after{content:"?";font:900 calc(var(--s)*.5) var(--body);color:var(--navy)}
.spo{width:var(--s,28px);height:var(--s,28px);flex:none;display:inline-block;background:url(../../../assets/graphics/tilesets/spoils.png) 0 0/100% 400% no-repeat}
.spo.attack{background-position:0 33.333%}.spo.delay{background-position:0 66.667%}.spo.speed{background-position:0 100%}
.bombi{width:var(--s,32px);height:var(--s,32px);flex:none;display:inline-block;background:url(../../../assets/graphics/animations/bombs.png) 0 0/100% 1200% no-repeat}
.tile{width:var(--s,28px);height:var(--s,28px);flex:none;display:inline-block;background:url(../../../assets/graphics/tilesets/map.png) 0 0/600% 100% no-repeat;border-radius:4px}
.thumb{display:block;width:100%;aspect-ratio:26/14;border-radius:8px;border:3px solid var(--navy);background:#1a2650;image-rendering:pixelated}
.card{background:#fff;border:3px solid var(--navy);border-radius:14px;padding:8px;display:flex;flex-direction:column;gap:6px;box-shadow:0 4px 0 rgba(5,15,50,.3);min-width:0}
.card.off{opacity:.5;filter:grayscale(.8)}
.card.on{border-color:#f0a400;box-shadow:0 0 0 3px var(--sun),0 4px 0 rgba(5,15,50,.3)}
.card .nm{font-family:var(--display);font-weight:400;color:var(--navy);font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.portrait .card,.landscape .card{border-width:2px;border-radius:12px;padding:7px}
.portrait .card .nm,.landscape .card .nm{font-size:15px}
.grid{display:grid;gap:14px;min-height:0}
.foot{display:flex;align-items:center;gap:12px;padding:12px 26px;background:linear-gradient(rgba(13,27,74,.0),rgba(13,27,74,.9) 30%);position:relative;z-index:2}
.portrait .foot{padding:10px 14px 8px}
.landscape .foot{padding:6px 8px}
.tabbar{display:grid;grid-template-columns:repeat(5,1fr);background:#13265f;border-top:3px solid #0d1b4a;margin-bottom:-22px;padding:6px 6px 26px}
.tabbar a{display:flex;flex-direction:column;align-items:center;gap:2px;color:#9fb4ee;text-decoration:none;font-size:11px;font-weight:900}
.tabbar a.on{color:var(--sun)}
.pager{display:flex;gap:6px;justify-content:flex-end;align-items:center;color:#fff;font-weight:900;font-size:14px}
.pager span{min-width:28px;height:28px;display:grid;place-items:center;border-radius:8px;background:rgba(255,255,255,.12)}
.pager span.on{background:var(--sun);color:var(--gtext)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:999px;background:#fff;border:2px solid var(--navy);font-weight:900;font-size:13px;white-space:nowrap}
.chip.on{background:var(--navy);color:#fff}
.tiles{display:grid;gap:10px}
.stat{background:#fff;border:3px solid var(--navy);border-radius:14px;padding:8px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat b{font-family:var(--display);font-weight:400;font-size:26px;color:var(--navy);font-variant-numeric:tabular-nums;line-height:1.1}
.stat small{font-size:12px;color:#5b6a99;font-weight:800}
.portrait .stat,.landscape .stat{border-width:2px;padding:6px 10px}
.portrait .stat b,.landscape .stat b{font-size:20px}
.prop{font-size:11px;font-weight:900;color:#9b4d00;background:#ffe2b8;border-radius:6px;padding:1px 6px;letter-spacing:.3px}
.hint{margin:0;font-size:13px;color:#4a5a8c;font-weight:800;text-align:center}
.keys{display:flex;gap:16px;justify-content:center;color:#cfe0ff;font-size:13px;font-weight:800}
.keys kbd{font:900 12px var(--body);background:#fff;color:var(--navy);border:2px solid var(--navy);border-radius:6px;padding:1px 6px;margin-right:4px}
.mono{font-family:ui-monospace,"Cascadia Code",Consolas,monospace;font-weight:700}

/* login */
.dlg{position:relative;aspect-ratio:1024/1536;flex:none}
.dlg>img{width:100%;height:100%;display:block}
.dlg-in{position:absolute;left:14%;right:14%;top:35.5%;bottom:17%;display:flex;flex-direction:column;justify-content:center;gap:var(--g,10px)}
.lbx{position:relative;width:100%;aspect-ratio:389/104;background:url(../../../assets/graphics/home/label_input_box.png) center/100% 100% no-repeat;flex:none}
.lbx b{position:absolute;left:3%;width:31%;top:50%;transform:translateY(-55%);text-align:center;color:#fff;font-family:var(--display);font-weight:400;font-size:var(--lf);text-shadow:0 2px 0 #1d3aa8;white-space:nowrap}
.lbx span{position:absolute;left:40%;right:9%;top:50%;transform:translateY(-55%);color:#9aa5c6;font-weight:900;font-size:var(--lf);white-space:nowrap;overflow:hidden}
.lbx span.v{color:var(--gtext)}
.conn{display:inline-flex;align-items:center;gap:8px;color:#fff;font-weight:900;font-size:14px;background:rgba(10,24,70,.72);border:2px solid rgba(255,255,255,.35);padding:6px 14px;border-radius:999px}
.peek{position:absolute;top:-30px}

/* game map */
.gm{display:grid;grid-template-columns:repeat(var(--cols),var(--ts));position:relative;border:4px solid #0d1b4a;border-radius:8px;box-shadow:0 0 0 3px rgba(255,255,255,.5),0 10px 30px rgba(0,0,0,.45);flex:none;background:#0d1b4a}
.gm .t{width:var(--ts);height:var(--ts);background:url(../../../assets/graphics/tilesets/map.png) 0 0/600% 100% no-repeat}
.t0,.t5{background-position:40% 0!important}.t1{background-position:20% 0!important}.t2{background-position:0 0!important}.t3{background-position:60% 0!important}.t4{background-position:80% 0!important}
.gm .o{position:absolute;width:var(--ts);height:var(--ts);background-repeat:no-repeat}
.o.p1{background-image:url(../../../assets/graphics/animations/player1.png);background-size:400% 400%;background-position:33.333% 0}
.o.p2{background-image:url(../../../assets/graphics/animations/player2.png);background-size:400% 400%;background-position:33.333% 66.667%}
.o.bomb{background-image:url(../../../assets/graphics/animations/bombs.png);background-size:100% 1200%;background-position:0 18.18%}

  if(thumbCache[v]) return thumbCache[v];
  const m=variant(v),k=6,c=document.createElement('canvas');c.width=26*k;c.height=14*k;
  const g=c.getContext('2d');
  m.forEach((r,y)=>r.forEach((x,i)=>{g.fillStyle=TC[x];g.fillRect(i*k,y*k,k,k);if(x===2){g.fillStyle='rgba(0,0,0,.18)';g.fillRect(i*k,y*k+k-2,k,2)}}));
  g.fillStyle='#2f8cf0';g.beginPath();g.arc(1.5*k+k*1,3.5*k,k*.45,0,7);g.fill();
  g.fillStyle='#ff8a1f';g.beginPath();g.arc(9.5*k,9.5*k,k*.45,0,7);g.fill();
  return thumbCache[v]=c.toDataURL();
}
const thumb=v=>`<img class="thumb" src="${thumbSrc(v)}" alt="">`;

// full map with real sprites; rot=true draws it rotated 90° clockwise (14 wide x 26 tall) for portrait phones
function gameMap(ts,o={}){
  const R=14,C=26,rot=!!o.rot,rows=rot?C:R,cols=rot?R:C;
  const at=(r,c)=>rot?[c,R-1-r]:[r,c];
  let t='';
  for(let y=0;y<rows;y++)for(let x=0;x<cols;x++){const [r,c]=rot?[R-1-x,y]:[y,x];t+=`<i class="t t${BASE[r][c]}"></i>`}
  const ov=(r,c,cls,inner='',st='')=>{const [y,x]=at(r,c);return `<i class="o ${cls}" style="left:${x*ts}px;top:${y*ts}px;${st}">${inner}</i>`};
  const C1='--c:#ff9f1a',C2='--c:#3aa8ff';
  let o2='';
  // P1 owns quarantine (5,1) + GST egg (1,23); P2 owns quarantine (8,1) + GST egg (12,23)
  if(o.play!==false) o2+=ov(1,23,'egg own','',C1)+ov(12,23,'gone','<b>2s</b>',C2)+ov(5,1,'qz','',C1)+ov(8,1,'qz','',C2);
  else o2+=ov(1,23,'egg')+ov(12,23,'egg');
  if(o.sets) o2+=[[3,1,'P1',C1],[5,1,'P1',C1],[1,23,'P1',C1],[10,1,'P2',C2],[8,1,'P2',C2],[12,23,'P2',C2]].map(([r,c,l,k])=>ov(r,c,'set',`<b>${l}</b>`,k)).join('');
  if(o.spoils!==false) SPOILS.forEach(([r,c,k])=>o2+=ov(r,c,'s s'+k));
  if(o.play!==false){
    o2+=ov(4,6,'bomb')+ov(7,14,'xc')+ov(6,14,'xv')+ov(5,14,'xu')+ov(8,14,'xd');
    o2+=ov(3,2,'p1')+ov(3,2,'shield')+ov(9,9,'p2')+ov(10,16,'p2');
    o2+=ov(8,1,'p2')+ov(8,1,'tag','<b>7</b>');
    o2+=ov(3,11,'pop','<b>+1</b>')+ov(9,16,'pop','<b>+3</b>')+ov(1,22,'pop neg','<b>−1</b>');
  }
  if(o.cursor) o2+=ov(6,9,'cur');
  return `<div class="gm ${o.grid?'gridlines':''}" style="--ts:${ts}px;--cols:${cols}">${t}${o2}</div>`;
}

  const box=k=>`<figure class="kfig"><div class="kbox"><div class="kx" data-ex="${k.id}" style="padding:${k.pad}px">${k.html}</div></div><figcaption><b>${k.id}.png</b>${k.slice?`<span>9-slice ${k.slice.join(' ')}</span>`:''}${k.tint?'<span>tint</span>':''}${k.note?`<em>${k.note}</em>`:''}</figcaption></figure>`;
  const sec=([t,items])=>`<section class="ksec"><h3>${t} <small>${items.length}</small></h3><div class="kgrid">${items.map(box).join('')}</div></section>`;
  const total=UIKIT.reduce((a,[,i])=>a+i.length,0);
  return `<div class="kit"><p class="kintro">${total} images → <code>assets/graphics/ui/&lt;name&gt;.png</code> at @2x, plus <code>ui_kit.json</code> with 9-slice insets. Checkerboard = transparent.</p>
    <section class="ksec"><h3>Colour tokens</h3><div class="ktok">${TOKENS.map(t=>`<div><i style="background:${t[1].includes('→')?`linear-gradient(${t[1].replace('→',',')})`:t[1]}"></i><b>${t[0]}</b><code>${t[1]}</code><span>${t[2]}</span></div>`).join('')}</div></section>
    <section class="ksec"><h3>Type</h3><table class="ktype">${TYPE.map(t=>`<tr><th>${t[0]}</th><td>${t[1]}</td><td>${t[2]}</td></tr>`).join('')}</table></section>
    ${UIKIT.map(sec).join('')}</div>`;
}
def('uikit','UI Kit','Hệ thống','ui_kit.md',null,{
  desktop:['Đây là <b>danh sách export</b>: mỗi ô là một file PNG trong <b>assets/graphics/ui/</b>, xuất ở @2x với nền trong suốt.','<b>Không ảnh nào chứa chữ.</b> Chữ do ImGui vẽ bằng font Lilita One và Nunito, nên đổi ngôn ngữ hay đổi chữ không cần làm lại ảnh.','Ảnh có ghi <b>9-slice</b> thì giãn được theo mọi kích thước, 4 góc giữ nguyên. Ảnh có ghi <b>tint</b> được xuất màu trắng, lúc vẽ nhân màu bằng tham số col của AddImage (ví dụ vòng màu của từng player).','Avatar tròn không cần ảnh riêng: dùng <b>AddImageRounded</b> với rounding = nửa cạnh để cắt tròn sprite.'],
  doc:['Trang mới, là "hợp đồng" giữa mockup và bước export. Tên file và thông số 9-slice sẽ được ghi vào <b>ui_kit.json</b>.'],
});
S.find(s=>s.id==='uikit').kit=kitPage;

// keep the index in play order rather than definition order
const ORDER=['splash','login','guest','register','forgot','menu','tutorial','friends','profile','leaderboard','settings','developer','join','joincode','create','lobby','training','rotate','countdown','hud','pause','eliminated','round','spectator','results','replay','viewer','browse','editor','dialogs','uikit'];
S.sort((a,b)=>ORDER.indexOf(a.id)-ORDER.indexOf(b.id));

// ---------------------------------------------------------------- viewer
// spec file for each screen in docs/designs
const SPEC={splash:'connecting',login:'login_as_player',guest:'login_as_guest',register:'create_account',forgot:'forgot_password',
  menu:'main_menu',tutorial:'how_to_play',friends:'friends',profile:'player_profile',leaderboard:'leaderboard',settings:'settings',
  developer:'developer_portal',join:'join_match',joincode:'join_private_room',create:'create_match',lobby:'match_lobby',
  training:'training_room',rotate:'rotate_device',countdown:'match_start',hud:'in_game_hud',pause:'pause_menu',eliminated:'eliminated',
  round:'round_result',spectator:'spectator_hud',results:'post_game_results',replay:'match_replay',browse:'browse_maps',
  editor:'map_editor',viewer:'replay_viewer',dialogs:'system_dialogs'};
const MODES={desktop:'Web / Desktop',portrait:'Mobile · dọc',landscape:'Mobile · ngang'};
const OUTER={desktop:[1280,834],portrait:[414,868],landscape:[868,414]};
// Phones run portrait; only gameplay and the editor rotate to landscape.
const LANDSCAPE_ON_PHONE=new Set(['hud','spectator','editor','viewer','countdown','pause','eliminated','round']);
const mobFF=scr=>LANDSCAPE_ON_PHONE.has(scr.id)?'landscape':'portrait';
let mode='desktop';
try{mode=localStorage.getItem('eb-mode2')||'desktop'}catch(e){}
if(!['desktop','mobile','all'].includes(mode)) mode='desktop';
const fits=[];
function device(ff,scr){
  const chrome=ff==='desktop'?`<div class="wbar"><i></i><i></i><i></i><span>Elefant Blaster</span></div>`:'';
  return `<div class="device ${ff}">${chrome}<div class="scr">${scr.render(ff)}</div></div>`;
}
function holder(ff,scr,maxH,cap){
  return `<div>${cap?`<p class="cap">${MODES[ff]}</p>`:''}<div class="holder" data-ff="${ff}" data-maxh="${maxH}">${device(ff,scr)}</div></div>`;
}
function fit(){
  document.querySelectorAll('.holder').forEach(h=>{
    const [w,hh]=OUTER[h.dataset.ff];const d=h.firstElementChild;
    const s=Math.min(h.clientWidth/w,(+h.dataset.maxh)/hh,1);
    d.style.transform=`scale(${s})`;d.style.left=Math.max(0,(h.clientWidth-w*s)/2)+'px';h.style.height=(hh*s)+'px';
  });
}
function current(){const id=location.hash.slice(1);return S.find(s=>s.id===id)||S[0]}
function render(){
  const scr=current();
  document.querySelectorAll('.seg button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.mode===mode));
  document.querySelectorAll('.idx a').forEach(a=>{if(a.getAttribute('href')==='#'+scr.id)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});
  $('#sname').textContent=scr.name;$('#ssrc').textContent='docs/designs/'+(scr.kit?scr.src:(SPEC[scr.id]||scr.id)+'.screen.md');
  if(scr.kit){$('#stage').innerHTML=scr.kit();$('#notes').innerHTML=`<div class="note"><h3>UI Kit</h3><ul>${scr.notes.desktop.map(x=>`<li>${x}</li>`).join('')}</ul></div>`;return;}
  const vh=Math.max(420,innerHeight-150);
  const st=$('#stage');
  const mf=mobFF(scr);
  if(mode==='all') st.innerHTML=mf==='portrait'
    ?`<div class="row2 rev">${holder('desktop',scr,600,true)}${holder('portrait',scr,600,true)}</div>`
    :holder('desktop',scr,600,true)+holder('landscape',scr,440,true);
  else if(mode==='mobile') st.innerHTML=holder(mf,scr,mf==='landscape'?Math.min(vh,520):vh,false);
  else st.innerHTML=holder('desktop',scr,vh,false);
  const n=scr.notes;
  const block=(ff)=>`<div class="note"><h3>${MODES[ff]}</h3><ul>${n[ff].map(x=>`<li>${x}</li>`).join('')}</ul></div>`;
  const shown=mode==='all'?['desktop',mf]:mode==='mobile'?[mf]:['desktop'];
  $('#notes').innerHTML=shown.map(block).join('')+`<div class="note doc"><h3>Thay đổi so với file .md</h3><ul>${n.doc.map(x=>`<li>${x}</li>`).join('')}</ul></div>`;
  fit();
}
function $(s){return document.querySelector(s)}
const groups=[...new Set(S.map(s=>s.group))];
$('#idx').innerHTML=groups.map(g=>`<section><h2>${g}</h2>${S.filter(s=>s.group===g).map(s=>`<a href="#${s.id}">${s.name}</a>`).join('')}</section>`).join('');
document.querySelectorAll('.seg button').forEach(b=>b.addEventListener('click',()=>{mode=b.dataset.mode;try{localStorage.setItem('eb-mode2',mode)}catch(e){}render()}));
addEventListener('hashchange',()=>{render();window.scrollTo({top:0})});
addEventListener('resize',fit);
render();
</script>
</body>
</html>
